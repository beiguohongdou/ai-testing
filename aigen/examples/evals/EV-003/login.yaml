module: login
cases:
  - case_id: TC-LOGIN-02
    title: 密码错误被拒，不返回 token
    req_ref: "OpenAPI POST /users/login responses.401"
    design_method: equivalence
    request:
      method: POST
      path: /users/login
      json: {email: "${CUSTOMER_EMAIL}", password: wrong-password}
    expected:
      - {target: body.error, op: eq, value: Unauthorized, source: "OpenAPI POST /users/login responses.401"}
      - {target: body.access_token, op: not_exists, source: "OpenAPI POST /users/login responses.401"}
      - {target: status, op: eq, value: 401, source: "OpenAPI POST /users/login responses.401"}
