[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caseflow"
version = "3.0.0"
description = "个人测试提效框架：需求/接口文档 → 测试用例 → 接口 + UI(Playwright) 自动化代码"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pytest>=7",
    "requests>=2.28",
    "pyyaml>=6",
]

[project.optional-dependencies]
ui = ["playwright>=1.49", "pytest-playwright>=0.5"]

[project.scripts]
caseflow = "caseflow.cli:main"

[tool.setuptools.packages.find]
include = ["caseflow*"]

[tool.setuptools.package-data]
caseflow = ["SKILL.md"]
